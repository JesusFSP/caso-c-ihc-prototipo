<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#F5F7F3"/><rect width="390" height="92" fill="#18312F"/><text x="24" y="30" font-size="12" fill="white" font-family="Arial">COMEDOR UNIVERSITARIO · DEMOSTRACIÓN</text><text x="24" y="65" font-size="25" font-weight="bold" fill="white" font-family="Arial">Tu almuerzo, a tiempo</text><text x="24" y="120" font-size="14" fill="#50635F" font-family="Arial"></text><text x="24" y="818" font-size="12" fill="#50635F" font-family="Arial">C-P01 · Datos referenciales · Sin cobros reales</text><text x="24" y="174" font-size="25" fill="#18312F" font-family="Arial" font-weight="bold">Compra tu ticket del día</text><text x="24" y="215" font-size="17" fill="#18312F" font-family="Arial" font-weight="normal">Elige tu menú y revisa el total</text><text x="24" y="240" font-size="17" fill="#18312F" font-family="Arial" font-weight="normal">antes de autorizar el pago.</text><rect x="24" y="280" width="342" height="150" rx="14" fill="white" stroke="#D8E1DC"/><text x="44" y="316" font-size="14" fill="#50635F" font-family="Arial" font-weight="bold">HOY · 26 SEPTIEMBRE 2026</text><text x="44" y="352" font-size="17" fill="#18312F" font-family="Arial" font-weight="bold">Regular · Vegetariano · Dieta</text><text x="44" y="392" font-size="16" fill="#18312F" font-family="Arial" font-weight="normal">Precio de prueba: S/ 5.00</text><rect x="24" y="480" width="342" height="48" rx="10" fill="#176B50" stroke="#176B50"/><text x="38" y="510" font-size="15" fill="white" font-family="Arial" font-weight="bold">Ver menús de hoy</text><text x="24" y="578" font-size="16" fill="#50635F" font-family="Arial" font-weight="normal">Si ya compraste, recuperaremos</text><text x="24" y="602" font-size="16" fill="#50635F" font-family="Arial" font-weight="normal">tu ticket al ingresar.</text></svg>